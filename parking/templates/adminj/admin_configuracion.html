{% extends "inveh/base111.html" %}

{% block contenido %}
<div class="adm-header">
    <h1>⚙️ Configuración</h1>
    <p>Administra las opciones generales del sistema.</p>
</div>

<div class="adm-form">
    <form method="post">
        {% csrf_token %}
        <label for="nombre">Nombre del sistema</label>
        <input type="text" id="nombre" name="nombre" value="AdminSoft">

        <label for="email">Correo de soporte</label>
        <input type="email" id="email" name="email" value="admin@soft.com">

        <button type="submit">💾 Guardar</button>
    </form>
</div>
{% endblock %}
