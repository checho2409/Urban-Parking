{% extends "soft/base222.html" %}

{% block contenido %}
<div class="user-header">
    <h1>👤 Mi Perfil</h1>
    <p>Aquí puedes actualizar tu información personal.</p>
</div>

<div class="user-form">
    <form method="post">
        {% csrf_token %}
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" value="{{ user.nombre }}">

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" value="{{ user.email }}">

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" name="telefono" value="{{ user.telefono }}">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password">

        <button type="submit">💾 Guardar cambios</button>
    </form>
</div>
{% endblock %}
